rules = (
{match = "class_i = 'speedcrunch'"; opacity = 0.85},
{match = "class_i = 'telegram-desktop'"; blur-background = false;},
{match = "I3_FLOATING_WINDOW@ = 1";
# unredir = true;
# transparet-clipping = true;
corner-radius = 10;
shadow = true;
},
)
