# animated stuff (PRETTTYYYYYYYY)
# blur:
# {
#   method = "dual_kawase";
#   strength = 2;
# }

# v13 dropped the old `timing = "0.2s cubic-bezier(...)"` key. A transition group now
# takes curve / duration / delay / start / end, and anything else in the group is
# ignored silently - the old timing lines were animating nothing, on a linear curve.

# dwm 6.6 showhide() parks hidden clients off screen with XMoveWindow rather than
# unmapping them, so a tag switch produces no map/unmap state change at all:
# workspace-in/out and show/hide can never fire here. position is the only trigger a
# switch produces, so smooth the movement dwm actually makes.
