# Config for the nested harness only — never the user's real config.
#
# This file has to parse clean. Hyprland pops an error bar for every config
# error, and that bar reserves ~61 px at the top of a monitor while also leaving
# a stale reservation on whatever monitor last held focus — exclusive zones are
# exactly what these assertions read, so `up` checks `hyprctl configerrors` and
# refuses to go on when it is not empty.

monitor=,1280x800@60,0x0,1

# Side by side, the way a real desktop is. `output create headless` parks every
# output at 0x0, and this repo's bar decides which monitor a bar is on by
# matching its window's geometry against hyprctl's layout positions - with two
# outputs both at 0x0 that match cannot be per-bar, so the harness lays them out
# like a machine with two plugs. Named rules win over the empty-name wildcard
# above, which still covers the nested WAYLAND-1 output.
monitor=headless-1,1280x800@60,0x0,1
monitor=headless-2,1280x800@60,1280x0,1

debug:disable_logs=false
debug:enable_stdout_logs=true
debug:disable_time=true

# Deterministic screenshots: without this Hyprland picks one of three bundled
# wallpapers at random per boot, so the screenshot deltas are not reproducible.
# A plain background also makes "the band is not black" about the bar alone.
misc:disable_hyprland_logo=1

# 0.56 takes `animation=<tree node>,<0|1>`; the node is "global", not "enabled".
animation=global,0
input:kb_layout=us

# Persistent workspaces, mirroring the real split (1-6 left output, 7-11 right).
# The bar's empty-workspace buttons only exist if `hyprctl -j workspaces` lists
# these while they hold zero windows, so the harness asserts exactly that.
workspace = 1, monitor:headless-1, persistent:true
workspace = 2, monitor:headless-1, persistent:true
workspace = 3, monitor:headless-1, persistent:true
workspace = 4, monitor:headless-1, persistent:true
workspace = 5, monitor:headless-1, persistent:true
workspace = 6, monitor:headless-1, persistent:true
workspace = 7, monitor:headless-2, persistent:true
workspace = 8, monitor:headless-2, persistent:true
workspace = 9, monitor:headless-2, persistent:true
workspace = 10, monitor:headless-2, persistent:true
workspace = 11, monitor:headless-2, persistent:true

bind=SUPER,RETURN,exec,foot
bind=SUPER,Q,killactive,
bind=SUPER,V,togglefloating,
